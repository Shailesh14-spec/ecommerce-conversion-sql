name: Retail Power BI source checks
on:
  push:
    paths: ['advanced-powerbi-retail/**', '.github/workflows/powerbi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advanced-powerbi-retail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/download_data.py
      - run: python scripts/build_data.py
      - run: python scripts/build_powerbi.py
      - run: python scripts/validate_pbir.py
      - run: python -m unittest discover -s tests -v
